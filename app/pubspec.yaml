name: noxus
description: "Your ultimate toolkit for lucid dreaming. "
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.3.0
  flutter_slidable: ^4.0.0
  flutter_timezone: ^4.1.0
  http: ^1.4.0
  one_clock: ^2.0.1
  path_provider: ^2.1.5
  provider: ^6.1.2
  timezone: ^0.10.0
  just_audio: ^0.10.4
  just_audio_background: ^0.0.1-beta.15
  pdf: ^3.11.3
  synchronized: ^3.3.0+3
  record: ^6.0.0
  audio_session: ^0.2.2
  intl: ^0.20.2
  bcrypt: ^1.1.3
  speech_to_text: ^7.4.0
  sqflite: ">=2.4.0 <2.4.2+1"
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts: 
    - family: RougeScript
      fonts:
        - asset: assets/fonts/RougeScript-Regular.ttf
  assets:
    - assets/audio/whitenoise/
    - assets/audio/alarm/

